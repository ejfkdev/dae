name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zip: upx
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            zip: none
          - target: x86_64-apple-darwin
            os: macos-latest
            zip: none
          - target: aarch64-apple-darwin
            os: macos-latest
            zip: none
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zip: upx
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            zip: none
    runs-on: ${{ matrix.os }}
    env:
      # 构建出的二进制内嵌版本号与触发构建的 GitHub tag 一致
      DAE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install cross (for aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: UPX compress
        if: matrix.zip == 'upx'
        uses: crazy-max/ghaction-upx@v3
        with:
          # 精确指向产物本体：`dae*` 通配会误吞同目录的 dae.d（dep-info 文本），
          # UPX 报 UnknownExecutableFormatException 导致整条流水线失败
          files: target/${{ matrix.target }}/release/dae${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}

      # macOS 产物默认未签名，ad-hoc 签名避免下载后被 Gatekeeper 拦（不做公证）
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - target/${{ matrix.target }}/release/dae

      - name: Set binary name
        id: bin
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64*) arch="x64" ;;
            aarch64*) arch="arm64" ;;
            *) exit 1 ;;
          esac
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          echo "name=dae-${{ runner.os }}-${arch}${ext}" >> $GITHUB_OUTPUT

      - name: Rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/dae"
          case "${{ matrix.target }}" in
            *windows*) src="${src}.exe" ;;
          esac
          mv "$src" "${{ steps.bin.outputs.name }}"

      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bin.outputs.name }}

  # 发版到 crates.io。注意：由 GITHUB_TOKEN 创建的 Release 不会触发
  # `on: release` 工作流，所以发版作为本工作流的一个 job 直接串联。
  publish-crates:
    needs: build
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          ver="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "Package version: ${ver}"
          code="$(curl -s -A 'dae-release-check' -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/dae-rs/${ver}")"
          if [ "${code}" = "200" ]; then
            echo "dae-rs ${ver} already exists on crates.io — skipping publish"
          else
            echo "Publishing dae-rs ${ver}..."
            cargo publish
          fi